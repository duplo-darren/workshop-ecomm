{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ecomm.postgres.fullname" . }}
  labels:
    {{- include "ecomm.componentLabels" (dict "ctx" $ "component" "postgres") | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.postgres.service.type }}
  ports:
    - name: postgres
      port: {{ .Values.postgres.service.port }}
      targetPort: postgres
      protocol: TCP
  selector:
    {{- include "ecomm.selectorLabels" (dict "ctx" $ "component" "postgres") | nindent 4 }}
{{- end }}
