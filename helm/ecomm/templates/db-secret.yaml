{{- if include "ecomm.needsDbSecret" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ecomm.dbSecretName" . }}
  labels:
    {{- include "ecomm.componentLabels" (dict "ctx" $ "component" "database") | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  {{- if and .Values.catalog.enabled .Values.catalog.databaseUrl (not .Values.catalog.existingSecret) }}
  catalog-database-url: {{ .Values.catalog.databaseUrl | quote }}
  {{- end }}
  {{- if and .Values.inventory.enabled .Values.inventory.databaseUrl (not .Values.inventory.existingSecret) }}
  inventory-database-url: {{ .Values.inventory.databaseUrl | quote }}
  {{- end }}
{{- end }}
