{{- if .Values.inventory.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ecomm.fullname" . }}-inventory
  labels:
    {{- include "ecomm.componentLabels" (dict "ctx" $ "component" "inventory") | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if not .Values.inventory.autoscaling.enabled }}
  replicas: {{ .Values.inventory.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "ecomm.selectorLabels" (dict "ctx" $ "component" "inventory") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ecomm.componentLabels" (dict "ctx" $ "component" "inventory") | nindent 8 }}
      {{- with .Values.inventory.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "ecomm.serviceAccountName" (dict "ctx" $ "component" "inventory" "svcValues" .Values.inventory) }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.postgres.enabled }}
      initContainers:
        {{- include "ecomm.waitForDb" . | nindent 8 }}
      {{- end }}
      containers:
        - name: inventory
          image: {{ include "ecomm.image" (dict "ctx" $ "service" "inventory" "svcValues" .Values.inventory) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.inventory.containerPort }}
          env:
            {{- include "ecomm.dbEnv" (dict "ctx" $ "component" "inventory" "svcValues" .Values.inventory "database" .Values.postgres.databases.inventory) | trim | nindent 12 }}
            {{- with .Values.inventory.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.inventory.resources | nindent 12 }}
      {{- with .Values.inventory.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.inventory.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.inventory.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
