{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ecomm.postgres.fullname" . }}-initdb
  labels:
    {{- include "ecomm.componentLabels" (dict "ctx" $ "component" "postgres") | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  # Executed once by the postgres entrypoint when the data directory is first
  # initialised. Each service keeps its own database (database-per-service).
  10-create-service-databases.sh: |
    #!/bin/sh
    set -e
    for db in {{ .Values.postgres.databases.catalog | quote }} {{ .Values.postgres.databases.inventory | quote }}; do
      exists=$(psql -tAc "SELECT 1 FROM pg_database WHERE datname = '$db'" \
        --username "$POSTGRES_USER" --dbname "$POSTGRES_DB")
      if [ "$exists" = "1" ]; then
        echo "Database $db already exists."
      else
        echo "Creating database $db ..."
        createdb --username "$POSTGRES_USER" --owner "$POSTGRES_USER" "$db"
      fi
    done
{{- end }}
